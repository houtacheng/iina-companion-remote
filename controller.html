<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IINA Remote Controller</title>
  <style>
    :root{color-scheme:dark;--bg:#111318;--panel:#1b1e25;--soft:#292d37;--accent:#ff5b42;--text:#f5f6f8;--muted:#9ca3af}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100vh;overflow:hidden}button,select,input{font:inherit;color:inherit;background:var(--soft);border:1px solid #3b404c;border-radius:8px}button{padding:9px 13px;cursor:pointer}button:hover{background:#373c48}.primary{background:var(--accent);border-color:var(--accent);font-weight:700}.app{display:grid;grid-template-columns:250px 1fr 310px;height:100vh}.side{background:#15171d;border-right:1px solid #2c3039;padding:16px;overflow:auto}.right{border:0;border-left:1px solid #2c3039}.brand{font-size:20px;font-weight:800;margin-bottom:16px}.player{padding:12px;margin:7px 0;border-radius:10px;background:var(--panel);cursor:pointer;border:1px solid transparent}.player.active{border-color:var(--accent)}.player small{display:block;color:var(--muted);margin-top:5px}.main{padding:24px;overflow:auto}.title{font-size:24px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{color:var(--muted);margin:7px 0 24px}.times{display:flex;justify-content:space-between;margin-top:7px;color:var(--muted);font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:var(--accent)}.transport{display:flex;gap:10px;justify-content:center;margin:25px 0;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--panel);padding:14px;border-radius:12px}.card label{display:block;color:var(--muted);margin-bottom:8px}.card select,.card input[type=number]{width:100%;padding:8px}.section-title{font-weight:700;margin:8px 0 12px}.list{display:flex;flex-direction:column;gap:7px}.item{padding:10px;border-radius:8px;background:var(--panel);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item.active{background:#4a302e;border:1px solid var(--accent)}.empty{color:var(--muted);padding:12px 0}.footer{position:absolute;bottom:12px;color:var(--muted);font-size:12px}@media(max-width:800px){.app{grid-template-columns:190px 1fr}.right{display:none}.grid{grid-template-columns:1fr}}
    .topline{display:flex;align-items:center;gap:12px}.topline .title{flex:1}.mode{padding:6px 10px;color:var(--muted)}.compact-tools,.compact-player{display:none}.compact .app{display:block}.compact .side,.compact .right,.compact .grid{display:none}.compact .main{padding:16px}.compact .topline .title{font-size:18px}.compact .status{margin:4px 0 12px}.compact .transport{margin:14px 0 12px;gap:6px;flex-wrap:nowrap}.compact .transport button{padding:8px 10px}.compact .compact-tools{display:flex;align-items:center;gap:8px}.compact .compact-tools input{flex:1}.compact .compact-player{display:block;width:100%;padding:7px;margin-bottom:10px}
  </style>
</head>
<body><div class="app">
  <aside class="side"><div class="brand">IINA Remote</div><div id="players"></div><div class="footer">⌘⇧R 開啟控制台</div></aside>
  <main class="main"><select id="compact-player" class="compact-player"></select><div class="topline"><div class="title" id="title">尚未選擇播放器</div><button class="mode" id="mode">精簡模式</button></div><div class="status" id="status">等待播放器狀態…</div>
    <input id="progress" type="range" min="0" max="100" step="0.1" value="0"><div class="times"><span id="position">--:--</span><span id="remaining">剩餘 --:--</span><span id="duration">--:--</span></div>
    <div class="transport"><button data-command="playlist_previous">⏮</button><button data-command="seek_relative" data-seconds="-10">−10 秒</button><button class="primary" id="play" data-command="toggle_play_pause">▶ 播放</button><button data-command="seek_relative" data-seconds="10">+10 秒</button><button data-command="playlist_next">⏭</button><button data-command="stop">■ 停止</button></div>
    <div class="compact-tools"><span>🔊</span><input id="compact-volume" type="range" min="0" max="200" value="50"><button data-command="toggle_mute">靜音</button><select id="compact-playback-mode"><option value="none">不循環</option><option value="single">單檔循環</option><option value="auto_next">依序播放</option><option value="playlist_loop">清單循環</option><option value="shuffle">隨機播放</option></select><select id="compact-screen"><option value="1">螢幕 1</option><option value="2">螢幕 2</option><option value="3">螢幕 3</option><option value="4">螢幕 4</option></select><button id="compact-fullscreen">全螢幕</button></div>
    <div class="grid">
      <div class="card"><label>音量 <span id="volume-value"></span></label><input id="volume" type="range" min="0" max="200" value="50"><button id="mute" data-command="toggle_mute">靜音</button></div>
      <div class="card"><label>播放速度</label><select id="speed"><option>.5</option><option>.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option></select></div>
      <div class="card"><label>音訊軌</label><select id="audio"></select></div><div class="card"><label>字幕軌</label><select id="subtitle"></select></div>
      <div class="card"><label>輸出螢幕</label><select id="screen"><option value="1">螢幕 1</option><option value="2">螢幕 2</option><option value="3">螢幕 3</option><option value="4">螢幕 4</option></select><button id="fullscreen">移動並全螢幕</button></div>
      <div class="card"><label>播放完畢</label><select id="end"><option value="hold">保留視窗</option><option value="close">關閉視窗</option><option value="loop">循環播放</option></select></div>
      <div class="card"><label>播放順序</label><select id="playback-mode"><option value="none">不循環／不自動下一首</option><option value="single">單檔循環</option><option value="auto_next">依序播放，播完停止</option><option value="playlist_loop">清單循環</option><option value="shuffle">隨機播放，播完停止</option></select></div>
    </div>
  </main>
  <aside class="side right"><div class="section-title">播放清單</div><div id="playlist" class="list"></div><div class="section-title" style="margin-top:22px">章節</div><div id="chapters" class="list"></div></aside>
</div><script>
let snapshot={players:[],selectedPlayerId:null,library:{files:[]}},selected=null,state=null,dragging=false,compact=localStorage.getItem('iina-remote-compact')==='1';
const $=id=>document.getElementById(id), fmt=v=>{if(v==null||!isFinite(v))return'--:--';v=Math.max(0,Math.floor(v));const h=Math.floor(v/3600),m=Math.floor(v%3600/60),s=v%60;return(h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(s).padStart(2,'0')};
function applyMode(){document.body.classList.toggle('compact',compact);$('mode').textContent=compact?'完整模式':'精簡模式';localStorage.setItem('iina-remote-compact',compact?'1':'0');post('controller-mode',{compact})}
function post(name,data){iina.postMessage(name,data||{})} function command(name,args){if(selected)post('command',{playerId:selected,command:name,args:args||{}})}
function optionList(el,items,current,empty){el.innerHTML='';if(!items||!items.length){el.add(new Option(empty||'無可用項目',''));return}items.forEach(x=>el.add(new Option(x.label||x.title||('軌道 '+x.id),x.id)));el.value=String(current==null?'':current)}
function choosePlayer(id){const p=snapshot.players.find(x=>x.id===id);if(!p)return;selected=id;state=p.state;post('select-player',{playerId:id});render()}
function renderPlayers(){const box=$('players'),picker=$('compact-player');box.innerHTML='';picker.innerHTML='';snapshot.players.forEach(p=>{const d=document.createElement('div');d.className='player '+(p.id===selected?'active':'');d.innerHTML='<b>'+escapeHTML(p.label||p.state?.title||'播放視窗')+'</b><small>'+escapeHTML(p.state?.playback||'等待狀態')+' · '+fmt(p.state?.remaining)+' remaining</small>';d.onclick=()=>choosePlayer(p.id);box.appendChild(d);picker.add(new Option(p.label||p.state?.title||'播放視窗',p.id))});picker.value=selected||'';if(!snapshot.players.length){box.innerHTML='<div class="empty">目前沒有播放視窗</div>';picker.add(new Option('目前沒有播放視窗',''))}}
function render(){renderPlayers();const p=snapshot.players.find(x=>x.id===selected);if(p)state=p.state;if(!state)return;$('title').textContent=state.title||state.filename||'未命名媒體';$('status').textContent=(state.playback==='playing'?'播放中':state.playback==='paused'?'已暫停':'閒置')+' · '+(state.fullscreen?'全螢幕':'視窗模式')+' · '+(state.videoInfo||'');if(!dragging)$('progress').value=state.progress||0;$('position').textContent=fmt(state.position);$('duration').textContent=fmt(state.duration);$('remaining').textContent='剩餘 '+fmt(state.remaining);$('play').textContent=state.paused?'▶ 播放':'Ⅱ 暫停';$('volume').value=state.volume||0;$('volume-value').textContent=Math.round(state.volume||0);$('mute').textContent=state.muted?'取消靜音':'靜音';$('speed').value=String(state.speed||1);optionList($('audio'),state.audioTracks,state.audioTrack,'無音軌');optionList($('subtitle'),state.subtitleTracks,state.subtitleTrack,'無字幕');$('end').value=state.endBehavior||'hold';renderList('playlist',state.playlistItems,state.playlistPosition,i=>command('playlist_play',{index:i+1}));renderList('chapters',state.chapters,state.chapter,i=>command('play_chapter',{chapter:i+1}))}
function renderList(id,items,active,click){const box=$(id);box.innerHTML='';(items||[]).forEach((x,i)=>{const d=document.createElement('div');d.className='item '+(i===active?'active':'');d.textContent=x.label||x.title||x.filename||('項目 '+(i+1));d.onclick=()=>click(i);box.appendChild(d)});if(!items||!items.length)box.innerHTML='<div class="empty">沒有項目</div>'}
function escapeHTML(v){const d=document.createElement('div');d.textContent=String(v||'');return d.innerHTML}
function syncCompactState(){if(!state)return;if(document.activeElement!==$('compact-volume'))$('compact-volume').value=state.volume||0;$('compact-playback-mode').value=state.playbackMode||'auto_next';$('playback-mode').value=state.playbackMode||'auto_next'}
document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>command(b.dataset.command,b.dataset.seconds?{seconds:Number(b.dataset.seconds)}:{}));$('progress').oninput=()=>dragging=true;$('progress').onchange=()=>{command('set_position_percent',{percent:Number($('progress').value)});dragging=false};$('volume').oninput=()=>{$('volume-value').textContent=$('volume').value};$('volume').onchange=()=>command('set_volume',{volume:Number($('volume').value)});$('speed').onchange=()=>command('set_speed',{speed:Number($('speed').value)});$('audio').onchange=()=>command('set_track',{trackType:'audio',id:Number($('audio').value)});$('subtitle').onchange=()=>command('set_track',{trackType:'subtitle',id:Number($('subtitle').value)});$('fullscreen').onclick=()=>command('fullscreen_on_screen',{screen:Number($('screen').value)});$('end').onchange=()=>command('set_end_behavior',{behavior:$('end').value});
$('mode').onclick=()=>{compact=!compact;applyMode()};$('compact-player').onchange=()=>choosePlayer($('compact-player').value);$('compact-volume').onchange=()=>command('set_volume',{volume:Number($('compact-volume').value)});$('compact-playback-mode').onchange=()=>command('set_playback_mode',{mode:$('compact-playback-mode').value});$('playback-mode').onchange=()=>command('set_playback_mode',{mode:$('playback-mode').value});$('compact-fullscreen').onclick=()=>command('fullscreen_on_screen',{screen:Number($('compact-screen').value)});applyMode();
iina.onMessage('snapshot',data=>{snapshot=data||snapshot;if(!selected||!snapshot.players.some(p=>p.id===selected))selected=snapshot.selectedPlayerId||snapshot.players[0]?.id||null;render();syncCompactState()});iina.onMessage('player-state',data=>{const p=snapshot.players.find(x=>x.id===data.playerId);if(p){p.state=data.state;p.label=data.label||p.label}else snapshot.players.push({id:data.playerId,label:data.label,state:data.state});if(data.playerId===selected){state=data.state;render();syncCompactState()}});iina.onMessage('command-result',data=>{if(data.playerId===selected&&data.state){state=data.state;render();syncCompactState()}});post('ready');
iina.onMessage('set-mode',data=>{compact=data.compact===true;applyMode()});window.addEventListener('beforeunload',()=>post('controller-closed'));
</script></body></html>
